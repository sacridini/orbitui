[workspace]
members = [".", "web"]
default-members = ["."]
resolver = "3"

[package]
name = "orbitui"
version = "0.2.0"
edition = "2024"
description = "Terminal planner of Earth observation satellite overpasses and imaging opportunities"
license = "MIT"
readme = "README.md"
repository = "https://github.com/sacridini/orbitui"
homepage = "https://sacridini.github.io/orbitui/"
keywords = ["satellite", "remote-sensing", "tui", "sgp4", "orbit"]
categories = ["command-line-utilities", "science::geo"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "orbitui"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
ratatui = { version = "0.30", default-features = false, features = ["std", "layout-cache", "underline-color"] }
sgp4 = "2"
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
directories = "6"
ratatui = { version = "0.30", features = ["crossterm"] }
ureq = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "Document",
    "Element",
    "HtmlAnchorElement",
    "HtmlElement",
    "Response",
    "Storage",
    "Url",
    "Window",
] }

# Propagation runs ~10^6 times per forecast: keep debug builds usable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
strip = true
