[workspace]
members = [".", "web"]
default-members = ["."]
resolver = "3"

[package]
name = "orbitui"
version = "0.3.0"
edition = "2024"
description = "Terminal planner of Earth observation satellite overpasses and imaging opportunities"
license = "MIT"
readme = "README.md"
repository = "https://github.com/sacridini/orbitui"
homepage = "https://sacridini.github.io/orbitui/"
keywords = ["satellite", "remote-sensing", "tui", "sgp4", "orbit"]
categories = ["command-line-utilities", "science::geo"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "orbitui"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
quick-xml = "0.38"
ratatui = { version = "0.30", default-features = false, features = ["std", "layout-cache", "underline-color"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sgp4 = "2"
sys-locale = "0.3"
toml = "0.9"
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
directories = "6"
ratatui = { version = "0.30", features = ["crossterm"] }
ureq = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
sys-locale = { version = "0.3", features = ["js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "Document",
    "Element",
    "HtmlAnchorElement",
    "HtmlElement",
    "Response",
    "Storage",
    "Url",
    "Window",
] }

[package.metadata.deb]
maintainer = "Eduardo Lacerda <eduardolacerdageo@gmail.com>"
copyright = "2026, Eduardo Lacerda"
license-file = ["LICENSE", "0"]
extended-description = """Plans Earth observation satellite overpasses from the terminal: when Sentinel, Landsat, CBERS, EnMAP, NISAR and other missions image an area of interest, with the viewing geometry, the Sun, clouds and ESA acquisition plans, on an ASCII globe."""
section = "science"
priority = "optional"
# Static (musl) binaries: no shared libraries to depend on.
depends = ""
assets = [
    ["target/release/orbitui", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/orbitui/README.md", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/orbitui", dest = "/usr/bin/orbitui", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/orbitui/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/orbitui/LICENSE", mode = "644", doc = true },
]

# Propagation runs ~10^6 times per forecast: keep debug builds usable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
strip = true
