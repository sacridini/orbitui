name: install-test

# Installs the published release the ways the README describes, on clean
# machines, and runs it. Run after a release, and weekly.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  script:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: curl -fsSL https://sacridini.github.io/orbitui/install.sh | sh
      - run: orbitui --version && orbitui --offline --list --days 1 > forecast.txt && head -5 forecast.txt

  apt:
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "ubuntu:22.04", "debian:12"]
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - run: |
          apt-get update && apt-get install -y curl ca-certificates
          curl -fsSLo /usr/share/keyrings/orbitui.gpg https://sacridini.github.io/orbitui/apt/orbitui.gpg
          curl -fsSLo /etc/apt/sources.list.d/orbitui.sources https://sacridini.github.io/orbitui/apt/orbitui.sources
          apt-get update && apt-get install -y orbitui
          orbitui --version && orbitui --offline --list --days 1 > forecast.txt && head -5 forecast.txt

  homebrew:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Homebrew on Linux
        if: runner.os == 'Linux'
        run: echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
      - run: brew install sacridini/tap/orbitui
      - run: orbitui --version && brew test orbitui
