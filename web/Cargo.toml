[package]
name = "orbitui-web"
version = "0.2.0"
edition = "2024"
publish = false
description = "orbitui in the browser"
license = "MIT"

[dependencies]
console_error_panic_hook = "0.1"
orbitui = { path = ".." }
ratzilla = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Blob",
    "DataTransfer",
    "DragEvent",
    "File",
    "FileList",
    "KeyboardEvent",
    "Location",
    "UrlSearchParams",
    "Window",
] }
